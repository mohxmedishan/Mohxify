name: Build Mohxify debug APK (CI artifact)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK with version
        run: |
          VERSION="2.1.${GITHUB_RUN_NUMBER}"
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/mohxify-${VERSION}.apk"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mohxify-${{ env.APK_VERSION }}
          path: app/build/outputs/apk/debug/mohxify-${{ env.APK_VERSION }}.apk
          if-no-files-found: error
          retention-days: 30
