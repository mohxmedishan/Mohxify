name: Build Mohxify desktop apps

on:
  push:
    branches: [main, feature/desktop-app]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
          - platform: macOS
            runner: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - platform: ChromeOS ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: deb
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      # Debian 12 is the compatibility baseline for ChromeOS Linux.
      # Build inside Bookworm to avoid Ubuntu 24.04's GLIBC 2.39.
      - name: Build ChromeOS ARM64 installer in Debian 12
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/desktop \
            debian:bookworm bash -lc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential curl wget file git pkg-config libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev libgtk-3-dev nodejs npm
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --target aarch64-unknown-linux-gnu
              . "$HOME/.cargo/env"
              npm install
              npm run tauri -- build --target aarch64-unknown-linux-gnu --bundles deb
            '
      - name: Install Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set up Node
        if: runner.os != 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        if: runner.os != 'Linux'
        run: npm install
      - name: Build installer
        if: runner.os != 'Linux'
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Mohxify-${{ matrix.platform }}-${{ github.run_number }}
          path: desktop/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*
          if-no-files-found: error
          retention-days: 30

  publish-downloads:
    name: Publish direct installer downloads
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installer files
        uses: actions/download-artifact@v4
        with:
          pattern: Mohxify-*
          path: release-assets
          merge-multiple: true
      - name: Publish individual installers for the website
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Mohxify Desktop (latest)
          target_commitish: main
          prerelease: true
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: true
