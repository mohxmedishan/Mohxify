name: Build signed Mohxify release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish private-key-signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify signing secrets and restore private keystore
        env:
          MOHXIFY_KEYSTORE_BASE64: ${{ secrets.MOHXIFY_KEYSTORE_BASE64 }}
          MOHXIFY_STORE_PASSWORD: ${{ secrets.MOHXIFY_STORE_PASSWORD }}
          MOHXIFY_KEY_ALIAS: ${{ secrets.MOHXIFY_KEY_ALIAS }}
          MOHXIFY_KEY_PASSWORD: ${{ secrets.MOHXIFY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MOHXIFY_KEYSTORE_BASE64" || { echo "::error::Missing MOHXIFY_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$MOHXIFY_STORE_PASSWORD" || { echo "::error::Missing MOHXIFY_STORE_PASSWORD repository secret"; exit 1; }
          test -n "$MOHXIFY_KEY_ALIAS" || { echo "::error::Missing MOHXIFY_KEY_ALIAS repository secret"; exit 1; }
          test -n "$MOHXIFY_KEY_PASSWORD" || { echo "::error::Missing MOHXIFY_KEY_PASSWORD repository secret"; exit 1; }
          echo "$MOHXIFY_KEYSTORE_BASE64" | base64 --decode > app/mohxify-release.keystore
          test -s app/mohxify-release.keystore
          echo "MOHXIFY_KEYSTORE_PATH=app/mohxify-release.keystore" >> "$GITHUB_ENV"
          echo "MOHXIFY_STORE_PASSWORD=$MOHXIFY_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MOHXIFY_KEY_ALIAS=$MOHXIFY_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MOHXIFY_KEY_PASSWORD=$MOHXIFY_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - name: Verify release signing identity
        run: |
          keytool -list -v -keystore "$MOHXIFY_KEYSTORE_PATH" \
            -storepass "$MOHXIFY_STORE_PASSWORD" -alias "$MOHXIFY_KEY_ALIAS"
      - name: Run unit tests
        run: gradle testReleaseUnitTest --no-daemon --stacktrace
      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK with version
        run: |
          VERSION="1.$GITHUB_RUN_NUMBER"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/mohxify-$VERSION.apk"
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Mohxify-release-${{ env.APK_VERSION }}
          path: app/build/outputs/apk/release/mohxify-${{ env.APK_VERSION }}.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ env.APK_VERSION }}
          name: Mohxify ${{ env.APK_VERSION }}
          files: app/build/outputs/apk/release/mohxify-${{ env.APK_VERSION }}.apk
          generate_release_notes: true
