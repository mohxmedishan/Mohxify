name: Generate permanent Mohxify debug keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate permanent JKS keystore
        run: |
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore mohxify-debug.keystore \
            -storepass mohxify-debug-password \
            -alias mohxify \
            -keypass mohxify-debug-password \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Mohxify Debug, OU=Personal, O=Mohxify, L=Unknown, ST=Unknown, C=US"
      - name: Verify keystore, alias and password
        run: |
          keytool -list -v \
            -storetype JKS \
            -keystore mohxify-debug.keystore \
            -storepass mohxify-debug-password \
            -alias mohxify
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: mohxify-debug-keystore
          path: mohxify-debug.keystore
          if-no-files-found: error
          retention-days: 7
