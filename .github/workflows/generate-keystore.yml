name: Generate permanent Mohxify debug keystore

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate JKS directly in the app folder
        run: |
          rm -f app/mohxify-debug.keystore
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore app/mohxify-debug.keystore \
            -storepass mohxify-debug-password \
            -alias mohxify \
            -keypass mohxify-debug-password \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Mohxify Debug, OU=Personal, O=Mohxify, L=Unknown, ST=Unknown, C=US"

      - name: Verify exact file used by the APK build
        run: |
          keytool -list -v \
            -storetype JKS \
            -keystore app/mohxify-debug.keystore \
            -storepass mohxify-debug-password \
            -alias mohxify
          test "$(xxd -p -l 4 app/mohxify-debug.keystore)" = "feedfeed"

      - name: Commit verified keystore to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/mohxify-debug.keystore
          git commit -m "Generate verified permanent Mohxify signing key"
          git push

      - name: Start APK build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-apk.yml --ref main
